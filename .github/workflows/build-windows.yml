name: Build Windows VST3 & Standalone EXE (FL Studio First)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Enable MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Checkout JUCE 8
        shell: bash
        run: |
          if [ ! -f "external/JUCE/CMakeLists.txt" ]; then
            git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git external/JUCE
          fi

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_EXTRAS=OFF -DJUCE_BUILD_EXAMPLES=OFF

      - name: Build VST3, Standalone EXE, and Tests
        run: |
          cmake --build build --config Release --target JDMixAIEngine_VST3 JDMixAIEngine_Standalone FifoFuzzTest DspChainTest

      - name: Run Tests
        run: |
          .\build\FifoFuzzTest.exe
          .\build\DspChainTest.exe

      - name: Stage Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/VST3
          New-Item -ItemType Directory -Force -Path artifacts/Standalone
          New-Item -ItemType Directory -Force -Path dist
          
          # Locate and stage VST3 bundle contents
          Get-ChildItem -Path build -Recurse -Filter "*.vst3" | Select-Object -First 1 | ForEach-Object {
            Write-Host "Found VST3: $($_.FullName)"
            Copy-Item -Recurse -Force "$($_.FullName)\*" artifacts/VST3/
          }
          
          # Locate and stage Standalone EXE
          Get-ChildItem -Path build -Recurse -Filter "*.exe" | Where-Object { $_.Name -notmatch "Test" } | ForEach-Object {
            Write-Host "Found Standalone EXE: $($_.FullName)"
            Copy-Item -Force $_.FullName artifacts/Standalone/
          }

          Compress-Archive -Path artifacts/VST3/* -DestinationPath dist/JDMixAIEngine-Windows-x64-VST3.zip
          Copy-Item -Force "artifacts/Standalone/*.exe" dist/

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Compile Inno Setup Installer (.exe)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "=== ARTIFACTS IN STANDALONE ==="
          Get-ChildItem -Recurse artifacts/Standalone
          Write-Host "=== ARTIFACTS IN VST3 ==="
          Get-ChildItem -Recurse artifacts/VST3

          Write-Host "=== COMPILING WITH ISCC ==="
          iscc /O"dist" installer/windows/JDMixAIEngine.iss

      - name: Upload Windows Binaries & Installer (.exe)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JDMixAIEngine-Windows-x64-Release
          path: |
            dist/*
            artifacts/Standalone/*.exe
          retention-days: 14
