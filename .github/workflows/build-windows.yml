name: Build Windows VST3 & Standalone EXE (FL Studio First)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Enable MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Checkout JUCE 8
        shell: bash
        run: |
          if [ ! -f "external/JUCE/CMakeLists.txt" ]; then
            git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git external/JUCE
          fi

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_EXTRAS=OFF -DJUCE_BUILD_EXAMPLES=OFF

      - name: Build VST3, Standalone EXE, and Tests
        run: |
          cmake --build build --config Release --target JDMixAIEngine_VST3 JDMixAIEngine_Standalone FifoFuzzTest DspChainTest

      - name: Run Tests
        run: |
          .\build\FifoFuzzTest.exe
          .\build\DspChainTest.exe

      - name: Stage Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          New-Item -ItemType Directory -Force -Path dist
          
          # Stage VST3 bundle
          Copy-Item -Recurse -Force "build/JDMixAIEngine_artefacts/Release/VST3/*.vst3" artifacts/
          Compress-Archive -Path artifacts/*.vst3 -DestinationPath dist/JDMixAIEngine-Windows-x64-VST3.zip

          # Stage Standalone EXE
          Copy-Item -Force "build/JDMixAIEngine_artefacts/Release/Standalone/*.exe" artifacts/
          Copy-Item -Force "artifacts/*.exe" dist/

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile Inno Setup Installer (.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/windows/JDMixAIEngine.iss

      - name: Upload Windows Binaries & Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: JDMixAIEngine-Windows-x64-Release
          path: |
            dist/*
            artifacts/*.exe
          retention-days: 14
